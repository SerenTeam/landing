<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Netlify form detection</title>
  </head>
  <body>
    <!--
      Formulaire statique servant UNIQUEMENT à la détection par Netlify au build.
      Le vrai formulaire (src/components/ContactContent.tsx) poste ses données ici
      en AJAX. Ne pas supprimer : sans ce fichier, Netlify Forms ne capte rien.
      Les champs déclarés ici doivent rester synchronisés avec ContactContent.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="firstname" />
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
